<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Dev Quest: play a platformer through the software development lifecycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f4b"/><stop offset="1" stop-color="#5a3a9e"/></linearGradient>
  </defs>
  <style>
    .t{font-family:'Courier New',monospace;font-weight:bold}
    .blink{animation:b 1.2s steps(2,start) infinite}
    @keyframes b{to{visibility:hidden}}
    .run{animation:run 7s linear infinite}
    @keyframes run{from{transform:translateX(-60px)}to{transform:translateX(960px)}}
    .hop{animation:hop 1.4s ease-out infinite}
    @keyframes hop{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-52px)}}
    .coin{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{50%{transform:scaleX(.2)}}
    .bug{animation:bug 7s linear infinite}
    @keyframes bug{from{transform:translateX(960px)}to{transform:translateX(-60px)}}
    .cloud{animation:cl 30s linear infinite}
    @keyframes cl{from{transform:translateX(0)}to{transform:translateX(-1100px)}}
  </style>
  <rect width="900" height="260" rx="14" fill="url(#sky)"/>
  <g fill="#fff" opacity=".12" class="cloud"><circle cx="1000" cy="60" r="26"/><circle cx="1030" cy="66" r="20"/><circle cx="970" cy="68" r="18"/><circle cx="1500" cy="110" r="26"/><circle cx="1530" cy="116" r="20"/></g>
  <g fill="#fff" opacity=".7"><rect x="60" y="30" width="3" height="3"/><rect x="200" y="70" width="3" height="3"/><rect x="420" y="25" width="3" height="3"/><rect x="640" y="60" width="3" height="3"/><rect x="800" y="35" width="3" height="3"/></g>
  <text x="450" y="78" text-anchor="middle" class="t" font-size="58" fill="#000">DEV QUEST</text>
  <text x="446" y="74" text-anchor="middle" class="t" font-size="58" fill="#ffd60a">DEV QUEST</text>
  <text x="450" y="108" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#fff">A Mario-style game through the whole Software Development Lifecycle</text>
  <text x="450" y="132" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#9ad1ff">Requirements · Analysis · Planning · Design · Build · Review · Test · Security · Deploy · Operate · Maintain · Retire</text>
  <rect x="0" y="206" width="900" height="54" fill="#4cc24c"/><rect x="0" y="216" width="900" height="44" fill="#8a5a2b"/>
  <g transform="translate(330 150)"><rect width="34" height="34" fill="#ffb703" stroke="#7a4e00" stroke-width="2"/><text x="17" y="25" text-anchor="middle" class="t" font-size="22" fill="#fff">?</text></g>
  <g class="coin"><ellipse cx="347" cy="136" rx="9" ry="11" fill="#ffd60a" stroke="#b8860b" stroke-width="2"/></g>
  <g class="bug"><g transform="translate(0 186)"><ellipse cx="14" cy="12" rx="13" ry="10" fill="#e63946"/><rect x="6" y="4" width="6" height="6" fill="#fff"/><rect x="16" y="4" width="6" height="6" fill="#fff"/><rect x="8" y="6" width="3" height="3"/><rect x="18" y="6" width="3" height="3"/></g></g>
  <g class="run"><g class="hop"><g transform="translate(0 176)"><rect x="3" y="22" width="8" height="8" fill="#1d3557"/><rect x="13" y="22" width="8" height="8" fill="#1d3557"/><rect x="0" y="10" width="24" height="14" rx="4" fill="#7b2cbf"/><rect x="2" y="-2" width="20" height="15" rx="5" fill="#ffcb9a"/><rect x="1" y="-4" width="22" height="6" fill="#5a3a22"/><rect x="15" y="4" width="3" height="4" fill="#111"/></g></g></g>
  <g class="blink"><rect x="320" y="226" width="260" height="26" rx="13" fill="#06d6a0"/><text x="450" y="244" text-anchor="middle" class="t" font-size="15" fill="#073b4c">▶ CLICK TO PLAY</text></g>
</svg>
